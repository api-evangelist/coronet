aid: coronet
name: CoroNet
description: >-
  Coro (CoroNet) is a cybersecurity company delivering a unified, AI-native
  security platform for lean IT teams, growing organizations, and managed
  service providers (MSPs). A single platform and dashboard consolidate endpoint
  protection, email protection, network protection (ZTNA/VPN), cloud app
  security, data governance, and security awareness training. The Coro Public
  API lets service providers and developers build applications that integrate
  with the platform: it is organized around workspaces (regular, channel, and
  child tenants) and exposes endpoints for managing workspaces, subscriptions,
  portal users, protected users and devices, device licensing, tickets, audit
  logs, and usage. Authentication uses OAuth2 client-credential pairs exchanged
  for a 24-hour bearer token, and Coro publishes a webhook surface with
  HMAC-signed events for billing and workspace automation.
